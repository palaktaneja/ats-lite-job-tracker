version: '3.9'

services:
  web:
    build: .
    container_name: ats-backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - FLASK_ENV=development

  redis:
    image: redis:7
    container_name: ats-redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: ats-celery
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
  
  ats-api:
    build: .
    env_file:
      - .env
  
  analytics:
    build: ./analytics-service
    container_name: ats-analytics
    ports:
      - "8000:8000"
    depends_on:
      - ats-api